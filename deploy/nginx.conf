map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API — also called directly by the MAUI mobile app, not just the Blazor backend.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # Videos of the topics (mp4), kept outside the web image: /opt/littlepolyglot/media/videos/{lang}/book-01/05.mp4 (lang = en / ru / uz,
    # the language the learner studies). They are uploaded in the admin page of the site.
    # nginx serves them itself, with range requests (seeking) and a long cache.
    #
    # The links of the old apps and pages had no language (/videos/book-01/05.mp4): those videos were English.
    location ~ ^/videos/(book-\d+/[\w.-]+)$ {
        alias              /media/videos/en/$1;
        types              { video/mp4 mp4; image/jpeg jpg; image/webp webp; }
        add_header         Cache-Control "public, max-age=3600";
        add_header         Access-Control-Allow-Origin "*";
        access_log         off;
    }

    location /videos/ {
        alias              /media/videos/;
        types              { video/mp4 mp4; image/jpeg jpg; image/webp webp; }
        add_header         Cache-Control "public, max-age=86400";
        add_header         Access-Control-Allow-Origin "*";
        access_log         off;
        try_files          $uri =404;
    }

    # Files of the apps (jumbo-windows.zip, jumbo.apk, ...): kept outside the web image in /opt/littlepolyglot/media/downloads, offered as a download.
    location ^~ /downloads/ {
        alias              /media/downloads/;
        add_header         Content-Disposition "attachment";
        add_header         Cache-Control "public, max-age=300";
        access_log         off;
        try_files          $uri =404;
    }

    # Blazor Server — needs websocket upgrade for the SignalR circuit.
    location / {
        proxy_pass         http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 100s;
    }
}
